name: C++ CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.build_type }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build python3

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build Project Atlas
        run: cmake --build build --parallel 2

      - name: Run automated tests
        run: ctest --test-dir build --output-on-failure


  frontend-checks:
    name: Frontend Tests and Build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check serverless API
        run: npx tsc --noEmit -p tsconfig.api.json

      - name: Run frontend tests
        run: npm run test

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
